<button id="startButton">Start asking</button>

<script>
  const questions = [
    "Sure?",
    "Positive?",
    "Really?",
    "Absolutely sure?"
  ];

  const maxAttempts = 20;

  document.getElementById("startButton").addEventListener("click", askAgain);

  function askAgain(attempt = 0) {
    if (attempt >= maxAttempts) {
      alert("Finished asking.");
      return;
    }

    // Pick a random question
    const randomIndex = Math.floor(Math.random() * questions.length);
    const question = questions[randomIndex];

    // The result is ignored, so OK and Cancel both continue
    confirm(question);

    // Wait briefly before showing the next popup
    setTimeout(() => {
      askAgain(attempt + 1);
    }, 100);
  }
</script>
